name: Deploy to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the dev branch.
# One-time setup: in the repo, go to Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". After that, this runs automatically.
on:
  push:
    branches:
      - claude/trusting-volta-9pswv5
      - main
  workflow_dispatch:

# Permissions needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is static and lives at the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
