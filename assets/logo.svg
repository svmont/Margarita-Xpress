<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Margarita Xpress">
  <defs>
    <linearGradient id="mxGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#0fb5a6"/>
    </linearGradient>
    <linearGradient id="mxDrink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#0c3b42"/>
  <!-- glass bowl -->
  <path d="M16 20 h32 l-13 16 v12 h7 a2 2 0 0 1 0 4 H22 a2 2 0 0 1 0-4 h7 V36 Z" fill="url(#mxGlass)"/>
  <!-- frozen drink -->
  <path d="M20 23 h24 l-9 11 h-6 Z" fill="url(#mxDrink)"/>
  <!-- salt rim -->
  <rect x="15" y="18" width="34" height="3.4" rx="1.7" fill="#fff8ee"/>
  <!-- lime wedge -->
  <circle cx="45" cy="20" r="5.4" fill="#84cc16" stroke="#fff8ee" stroke-width="1.4"/>
  <path d="M45 20 m-3.6 0 a3.6 3.6 0 0 1 7.2 0 Z" fill="#bef264"/>
  <!-- straw -->
  <rect x="35" y="9" width="2.6" height="18" rx="1.3" transform="rotate(14 36 18)" fill="#ff6b5c"/>
</svg>
